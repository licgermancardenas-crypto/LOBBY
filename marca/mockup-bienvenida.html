<title>Lobby — Welcome</title>
<style>
  :root {
    --ink: #1A1023;
    --purple: #4B2E86;

    --pink: #F45FC0;
    --cream: #FBF3E7;
    --peach: #FFD9A8;
    --lavender: #B9ADED;
    --yellow: #FFD45A;
    --panel: rgba(26, 16, 35, .96);
    --field: rgba(139, 110, 242, .10);
    --border: rgba(185, 173, 237, .28);

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
    color: white;
    background:
      radial-gradient(circle at 50% 45%, rgba(255, 217, 168, .55), transparent 28%),
      linear-gradient(135deg, #fbf3e7 0%, #d9c9ff 42%, #8b6ef2 100%);
    overflow-x: hidden;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .auth {
    position: relative;
    z-index: 2;
    width: min(720px, calc(100% - 32px));
    margin-top: clamp(470px, 53vh, 680px);
    margin-bottom: 32px;
    padding: 42px 58px 34px;
    border-radius: 30px;
    background: var(--panel);
    border: 1px solid rgba(185,173,237,.20);
    box-shadow:
      0 30px 80px rgba(26,16,35,.42),
      0 0 50px rgba(139,110,242,.14);
    backdrop-filter: blur(18px);
  }

  .title {
    margin: 0;
    text-align: center;
    font-size: clamp(32px, 4vw, 52px);
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -1.8px;
  }

  .title .accent {
    background: linear-gradient(90deg, #ffffff 5%, var(--lilac) 95%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 12px 0 30px;
    text-align: center;
    color: var(--lavender);
    font-size: 20px;
    letter-spacing: .08em;
  }

  form {
    display: grid;
    gap: 14px;
  }

  .field {
    position: relative;
  }

  .field input {
    width: 100%;
    height: 68px;
    border-radius: 17px;
    border: 1px solid var(--border);
    outline: none;
    background: var(--field);
    color: white;
    padding: 0 54px 0 60px;
    font-size: 18px;
    transition: .2s ease;
  }

  .field input::placeholder { color: var(--lavender); }

  .field input:focus {
    border-color: var(--lilac);
    box-shadow: 0 0 0 4px rgba(139,110,242,.14);
  }

  .icon {
    position: absolute;
    left: 21px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--lavender);
    font-size: 22px;
  }

  .toggle {
    position: absolute;
    right: 17px;
    top: 50%;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    color: var(--lavender);
    cursor: pointer;
    font-size: 21px;
  }

  .primary {
    margin-top: 4px;
    height: 70px;
    border: 0;
    border-radius: 18px;
    background: var(--yellow);
    color: var(--ink);
    font-size: 19px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(255,212,90,.20);
    transition: transform .15s ease, filter .15s ease;
  }

  .primary:hover { transform: translateY(-1px); filter: brightness(1.04); }

  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 23px 0 16px;
    color: var(--lavender);
  }

  .divider::before,
  .divider::after {
    content: "";
    height: 1px;
    flex: 1;
    background: rgba(185,173,237,.25);
  }

  .socials {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .social {
    height: 64px;
    border: 1px solid rgba(185,173,237,.40);
    border-radius: 16px;
    background: transparent;
    color: white;
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: background .15s ease, border-color .15s ease;
  }

  .social:hover {
    background: rgba(139,110,242,.10);
    border-color: var(--lilac);
  }

  .google { font-weight: 700; font-size: 20px; }
  .apple { font-size: 23px; }

  .login {
    margin: 26px 0 0;
    text-align: center;
    color: var(--lavender);
    font-size: 16px;
  }

  .login a {
    color: var(--yellow);
    font-weight: 800;
    text-decoration: none;
  }

  .login a:hover { text-decoration: underline; }

  @media (max-width: 650px) {
    .world {
      height: 520px;
      min-height: 520px;
      background-position: 50% top;
    }

    .auth {
      margin-top: 410px;
      padding: 30px 22px 26px;
      border-radius: 24px;
    }

    .subtitle { font-size: 15px; }

    .socials { grid-template-columns: 1fr; }

    .social { height: 58px; }
  }
</style>
</head>
<body>
<main class="page">
  <div class="world" aria-hidden="true"></div>

  <section class="auth" aria-labelledby="welcome">
    <h1 id="welcome" class="title">
      Welcome to <span class="accent">Lobby</span>
    </h1>
    <p class="subtitle">Play. Connect. Create. Together.</p>

    <form id="signupForm">
      <div class="field">
        <span class="icon" aria-hidden="true">✉</span>
        <input id="email" name="email" type="email" placeholder="Email"
               autocomplete="email" required>
      </div>

      <div class="field">
        <span class="icon" aria-hidden="true">♙</span>
        <input id="password" name="password" type="password"
               placeholder="Contraseña (mín. 8 caracteres)"
               minlength="8" autocomplete="new-password" required>
        <button class="toggle" type="button" id="togglePassword"
                aria-label="Mostrar contraseña">◉</button>
      </div>

      <button class="primary" type="submit">
        Crear cuenta <span aria-hidden="true">→</span>
      </button>
    </form>

    <div class="divider"><span>o</span></div>

    <div class="socials">
      <button class="social" type="button" id="google">
        <span class="google">G</span>
        Continuar con Google
      </button>
      <button class="social" type="button" id="apple">
        <span class="apple">●</span>
        Continuar con Apple
      </button>
    </div>

    <p class="login">
      ¿Ya tenés una cuenta?
      <a href="#" id="loginLink">Ingresá</a>
    </p>
  </section>
</main>

<script>
  const password = document.getElementById("password");
  const toggle = document.getElementById("togglePassword");

  toggle.addEventListener("click", () => {
    const visible = password.type === "text";
    password.type = visible ? "password" : "text";
    toggle.textContent = visible ? "◉" : "◌";
    toggle.setAttribute("aria-label", visible
      ? "Mostrar contraseña"
      : "Ocultar contraseña");
  });

  document.getElementById("signupForm").addEventListener("submit", (e) => {
    e.preventDefault();
    alert("Demo: cuenta lista para crear.");
  });

  document.getElementById("google").addEventListener("click", () => {
    alert("Demo: iniciar registro con Google.");
  });

  document.getElementById("apple").addEventListener("click", () => {
    alert("Demo: iniciar registro con Apple.");
  });

  document.getElementById("loginLink").addEventListener("click", (e) => {
    e.preventDefault();
    alert("Demo: abrir pantalla de login.");
  });
</script>
</body>
</html>
